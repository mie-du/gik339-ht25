<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="#" />
    <title>FL6 - CSS-ramverk - Tailwind</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <header><h1>En sida som visar hälsningar</h1></header>
    <main class="view" id="list">
      <h2 class="">Hälsningar</h2>
      <section
        class="mb-4 rounded-md border border-gray-300 w-[286px]"
        style="width: 18rem">
        <img
          src="https://placehold.co/286x180?text=Hälsning+1+bild"
          alt="Placeholder-bild 1"
          class="w-full" />
        <div class="p-4">
          <h3 class="text-2xl mb-2 text-gray-700">Hälsning 1 titel</h3>
          <p class="text-gray-500">Hälsing 1</p>
        </div>
      </section>

      <section class="mb-4 rounded-md border border-gray-300 w-[286px]">
        <img
          src="https://placehold.co/286x180?text=Hälsning+2+bild"
          alt="Placeholder-bild 1"
          2
          class="w-full" />
        <div class="p-4">
          <h3 class="text-2xl mb-2">Hälsning 2 titel</h3>
          <p class="">Hälsing 2</p>
        </div>
      </section>
    </main>
    <main class="view" id="create">
      <h2>Skapa ny hälsning</h2>
      <form id="greetings">
        <div class="">
          <label class="" for="message">Meddelande</label>
          <input class="" type="text" id="message" />
        </div>
        <button
          class="bg-blue-300 hover:bg-blue-200 px-4 py-1 rounded-full cursor-pointer"
          type="submit">
          Skicka
        </button>
      </form>
    </main>

    <script src="script.js"></script>
  </body>
</html>
